name: news-rss-runner

on:
  schedule:
    - cron: '8 23 * * *'   # 早报: 北京 08:00 前 (23:08 UTC, 含 GH 抖动余量)
    - cron: '8 5 * * *'    # 晚报: 11:08 那班实测中位迟到 4.8h (3.3-6.3h), 提前 6h 让实际落在 08:25-11:25 UTC (2026-10-30 Tesla)
  workflow_dispatch: {}    # 手动触发 (demo / 补跑)

permissions:
  contents: write          # policy state commit-back (github-actions[bot], ephemeral token)

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Run RSS runner (7 rounds x 7 min)
        shell: bash
        run: |
          set -eo pipefail
          python3 runner_news_gh.py 2>&1 | tee runner.log

      - name: Run ticker news (no-op if tickers.txt empty)
        shell: bash
        run: |
          set -eo pipefail
          python3 ticker_news.py 2>&1 | tee ticker_news.log

      - name: Run policy watch
        shell: bash
        run: |
          set -eo pipefail
          python3 policy_watch.py 2>&1 | tee policy_watch.log

      - name: Commit policy state (baseline persistence + repo keepalive)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policy_state/
          if git diff --cached --quiet; then
            echo "no policy state change"
          else
            git commit -m "policy state: $(date -u +%FT%TZ)"
            git pull --rebase -q || true
            git push
          fi

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: news-payload
          path: |
            news.jsonl.gz
            runner.log
            ticker_news.jsonl
            ticker_news.log
            policy_diff.json
            policy_watch.log
          retention-days: 7
          if-no-files-found: error
